services:
  codex:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # run.sh がホストの id -u / id -g をエクスポートしてから
        # docker-compose を呼び出すことで、コンテナ内ユーザーの
        # UID/GID をホストの実行ユーザーに合わせる。
        USERNAME: ${USERNAME:-codex}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    ports:
      - 5173:5173
    image: codex-container:latest
    container_name: ${CONTAINER_NAME:-codex}
    volumes:
      # プロジェクトルートを /workspace にマウント。
      # このcompose.yamlを別プロジェクトにコピーして使う場合は
      # .env の PROJECT_ROOT を、プロジェクトルートまでの相対パスに合わせて変更する。
      - ${PROJECT_ROOT:-..}:/workspace
      # codex login の認証情報(~/.codex/auth.json)や config.toml、
      # セッション履歴などを永続化する。全プロジェクトで固定名の
      # ボリュームを共有するので、一度ログインすればどのプロジェクトの
      # コンテナからでも再ログイン不要になる。
      - codex-home:/home/${USERNAME:-codex}/.codex
      # claude login の認証情報(~/.claude/.credentials.json)や settings.json、
      # プロジェクト履歴などを永続化する。
      - claude-home:/home/${USERNAME:-codex}/.claude
      # Antigravity CLI(agy)の設定・認証情報(~/.gemini/antigravity-cli/ 配下)を永続化する。
      # ただし認証トークンはLinuxのSecret Service(D-Bus/keyring)経由で保存される場合があり、
      # コンテナ内にkeyringデーモンが無いと再ログインが必要になる可能性がある(要検証)。
      - gemini-home:/home/${USERNAME:-codex}/.gemini
    working_dir: /workspace
    tty: true
    stdin_open: true

volumes:
  codex-home:
    name: codex-cli-home
  claude-home:
    name: claude-cli-home
  gemini-home:
    name: gemini-cli-home
